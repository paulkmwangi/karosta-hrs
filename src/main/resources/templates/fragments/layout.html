<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">N</span>
        <span><strong>northstar</strong><small>PEOPLE & CULTURE</small></span>
    </a>
    <div class="nav-label">WORKSPACE</div>
    <nav class="side-nav">
        <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? ' active' : ''"><span>▦</span> Dashboard</a>
        <a th:href="@{/employees}" th:classappend="${activePage == 'employees'} ? ' active' : ''"><span>♙</span> Employees</a>
        <a th:href="@{/attendance}" th:classappend="${activePage == 'attendance'} ? ' active' : ''"><span>◷</span> Attendance</a>
        <a th:href="@{/leave}" th:classappend="${activePage == 'leave'} ? ' active' : ''"><span>▤</span> Leave management</a>
        <a th:href="@{/payroll}" th:classappend="${activePage == 'payroll'} ? ' active' : ''"><span>＄</span> Payroll</a>
        <a th:href="@{/recruitment}" th:classappend="${activePage == 'recruitment'} ? ' active' : ''"><span>♧</span> Recruitment</a>
    </nav>
    <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">?</div><strong>Need a hand?</strong><p>Visit the help centre for tips and support.</p><a href="mailto:support@northstarhr.test">Get support →</a></div>
        <div class="profile-mini"><div class="avatar avatar-purple">AW</div><div><strong>Amina Wanjiku</strong><small>HR Administrator</small></div><span class="dots">•••</span></div>
    </div>
</aside>
<header th:fragment="topbar" class="topbar">
    <div class="breadcrumb">Northstar HR <span>/</span> <strong th:text="${pageTitle}">Overview</strong></div>
    <div class="top-actions"><span class="demo-pill"><i></i> DEMO DATA</span><button class="icon-button" aria-label="Notifications">♧<b></b></button><div class="avatar avatar-purple">AW</div></div>
</header>
<div th:fragment="flash" class="flash-wrap">
    <div class="flash success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="flash error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</div>
</body>
</html>
